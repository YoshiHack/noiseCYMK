name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Print runner info
        shell: bash
        run: |
          echo "=== runner OS ==="
          systeminfo | head -3
          echo "=== rustc ==="
          rustc --version
          cargo --version
          echo "=== node ==="
          node --version
          npm --version
          echo "=== target ==="
          rustup target list --installed
          echo "=== WiX ==="
          ls "/c/Program Files (x86)/WiX Toolset v3.14/bin/" 2>&1 || echo "WiX not found"
          echo "=== NSIS ==="
          which makensis || echo "makensis not in PATH"

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      # Cross-platform lib + tests. Confirms the Govee LAN protocol,
      # capabilities map, sampler (gamma-correct), effects, and CMYK
      # decomposition are all green on Windows MSVC. Runs without the
      # `windows-capture` feature so the DXGI module is not compiled
      # in this step — keeps the test build small and portable.
      - name: Run cargo test (lib only, no Tauri build)
        working-directory: src-tauri
        shell: bash
        env:
          CARGO_TARGET_DIR: src-tauri/target
        run: |
          set -euo pipefail
          cargo test --lib 2>&1 | tail -100

      - name: Build frontend
        run: npm run build

      - name: Verify dist
        shell: bash
        run: |
          echo "=== dist directory ==="
          ls -la dist/ 2>&1 || { echo "DIST MISSING"; exit 1; }
          ls -la dist/assets/ 2>&1

      # Tauri CLI must be installed before invoking `cargo tauri build`.
      # We use the stable tauri-cli version matching Tauri 2.
      - name: Install tauri-cli
        shell: bash
        run: |
          cargo install tauri-cli --version "^2.0" --locked

      - name: Build Tauri app (release)
        working-directory: src-tauri
        shell: bash
        env:
          CARGO_TARGET_DIR: src-tauri/target
        run: |
          set -euo pipefail
          set -x
          echo "=== cargo-tauri version ==="
          cargo tauri --version
          echo "=== cargo build --release ==="
          if ! cargo build --release 2>&1 | tee /tmp/cargo-build.log; then
            echo "===== last 100 lines of cargo build log ====="
            tail -100 /tmp/cargo-build.log
            echo "===== full cargo build log as artifact ====="
            cp /tmp/cargo-build.log /tmp/cargo-build-failure.log
            exit 1
          fi
          echo "=== looking for exe ==="
          find src-tauri/target/release -maxdepth 2 -name "noiseCYMK.exe" 2>&1 || true
          ls -la src-tauri/target/release/ 2>&1 | head -40 || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-build-failure-log
          path: /tmp/cargo-build-failure.log
          if-no-files-found: ignore

      - name: Run Tauri bundle
        working-directory: src-tauri
        shell: bash
        env:
          CARGO_TARGET_DIR: src-tauri/target
        run: |
          set -euo pipefail
          set -x
          echo "=== running cargo tauri build (msi + nsis) ==="
          cargo tauri build --bundles msi nsis 2>&1 | tee /tmp/tauri-build.log | tail -200 || {
            echo "TAURI BUILD FAILED"
            echo "=== last 300 lines of tauri log ==="
            tail -300 /tmp/tauri-build.log
            exit 1
          }
          echo "=== bundle dir tree ==="
          ls -laR src-tauri/target/release/bundle/ 2>&1 | head -100
          echo "=== where the exe ended up ==="
          find src-tauri/target -name "noiseCYMK*.exe" 2>&1
          find src-tauri/target -name "*.msi" 2>&1
          find src-tauri/target -name "*-setup*.exe" 2>&1
          find src-tauri/target -name "*-installer*.exe" 2>&1

      - name: Upload MSI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noiseCYMK-windows-msi
          path: |
            src-tauri/src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noiseCYMK-windows-nsis
          path: |
            src-tauri/src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn