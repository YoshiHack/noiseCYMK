name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Print runner info
        shell: bash
        run: |
          echo "=== runner OS ==="
          systeminfo | head -3
          echo "=== rustc ==="
          rustc --version
          cargo --version
          echo "=== node ==="
          node --version
          npm --version
          echo "=== target ==="
          rustup target list --installed
          echo "=== WiX ==="
          ls "/c/Program Files (x86)/WiX Toolset v3.14/bin/" 2>&1 || echo "WiX not found"
          echo "=== NSIS ==="
          which makensis || echo "makensis not in PATH"

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Run cargo test (lib only, no Tauri build)
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build frontend
        run: npm run build

      - name: Verify dist
        shell: bash
        run: |
          echo "=== dist directory ==="
          ls -la dist/ 2>&1 || { echo "DIST MISSING"; exit 1; }
          ls -la dist/assets/ 2>&1

      - name: Build Tauri app (release)
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          set -x
          echo "=== starting cargo build --release ==="
          cargo build --release --verbose 2>&1 | tail -200
          echo "=== build complete, looking for exe ==="
          find target/release -maxdepth 2 -name "lightsync.exe" 2>&1 || true
          ls -la target/release/ 2>&1 | head -30

      - name: Run Tauri bundle
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          set -x
          echo "=== running cargo tauri build ==="
          cargo tauri build --bundles msi nsis 2>&1 | tail -200 || { echo "TAURI BUILD FAILED"; exit 1; }
          echo "=== bundle dir tree ==="
          ls -laR target/release/bundle/ 2>&1 | head -100

      - name: Upload MSI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightsync-windows
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightsync-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error