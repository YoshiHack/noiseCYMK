name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Run cargo test (Linux-compilable core)
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build frontend
        run: npm run build

      - name: Build MSI installer
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles msi nsis

      - name: Verify bundle output exists
        shell: bash
        run: |
          echo "=== cargo build artifacts ==="
          find src-tauri/target/release -maxdepth 2 -name "lightsync.exe" -o -name "lightsync" 2>/dev/null || echo "no exe"
          echo "=== bundle directory tree ==="
          if [ -d "src-tauri/target/release/bundle" ]; then
            ls -laR src-tauri/target/release/bundle/ 2>&1 | head -80
          else
            echo "BUNDLE DIR DOES NOT EXIST: src-tauri/target/release/bundle"
          fi
          echo "=== tauri.conf.json bundle config ==="
          cat src-tauri/tauri.conf.json | python3 -c "import json,sys; print(json.load(sys.stdin)['bundle'])"
          echo "=== which wix / nsis tools ==="
          which wix candle light 2>/dev/null || echo "no wix"
          which makensis 2>/dev/null || echo "no makensis"
          echo "=== last 80 lines of any Cargo stderr in target ==="
          find src-tauri/target/release -name "stderr" 2>/dev/null | head -5 | while read f; do echo "-- $f --"; tail -20 "$f"; done

      - name: Upload MSI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightsync-windows
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightsync-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error