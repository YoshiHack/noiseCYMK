[package]
name = "noise_cymk"
version = "0.1.0"
description = "Local-only RGB controller for Govee (and friends) over LAN — SignalRGB replacement. CMYK-themed per-device zones."
authors = ["Jackson Hughes"]
edition = "2024"

[lib]
name = "noise_cymk"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "noiseCYMK"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 runtime + IPC
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

# Async runtime + UDP
tokio = { version = "1", features = ["full"] }
socket2 = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling / utilities
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
once_cell = "1"

# HTTP server (LAN control, off by default)
axum = "0.7"
tower = "0.5"

# Cross-platform screen capture. We use `xcap` on Linux/macOS and
# `screenshots` on Windows — both expose a uniform "list monitors,
# capture_image → BGRA/RGBA buffer" interface that our `ScreenCapture`
# enum bridges. Neither crate pulls in the full `windows` crate, which
# keeps the test build small and avoids version conflicts with Tauri's
# own windows-rs usage.
[target.'cfg(not(target_os = "windows"))'.dependencies]
xcap = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
screenshots = "0.8"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]