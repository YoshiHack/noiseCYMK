[package]
name = "noise_cymk"
version = "0.1.0"
description = "Local-only RGB controller for Govee (and friends) over LAN — SignalRGB replacement. CMYK-themed per-device zones."
authors = ["Jackson Hughes"]
edition = "2024"

[lib]
name = "noise_cymk"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "noiseCYMK"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 runtime + IPC
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

# Async runtime + UDP
tokio = { version = "1", features = ["full"] }
socket2 = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling / utilities
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
once_cell = "1"

# HTTP server (LAN control, off by default)
axum = "0.7"
tower = "0.5"

# Cross-platform screen capture: xcap on Linux/macOS, DXGI on Windows.
# xcap is cfg-gated to non-Windows so the lib compiles cleanly without
# PipeWire/etc on every dev machine.
[target.'cfg(not(target_os = "windows"))'.dependencies]
xcap = "0.9"

# Windows-only DXGI Desktop Duplication. Marked optional so the lib
# can build on Windows CI without dragging the full `windows` crate
# into the test binary. The actual app binary below turns it on.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_WindowsAndMessaging",
], optional = true }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Enable DXGI capture for the main binary. Tests build without it.
windows-capture = []

# Force the windows-capture feature on for the noiseCYMK binary so the
# shipped app always has real capture. The lib and tests build
# without it on every platform.
[package.metadata]
# documented hint: main bin needs windows-capture; the workflow sets
# it explicitly via --features windows-capture on the bundle step.